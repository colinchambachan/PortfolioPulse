services:
  - type: web
    name: portfoliopulse-api-dev
    runtime: docker
    rootDir: server
    plan: starter
    branch: dev
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: AWS_REGION
        value: us-east-1
      - key: TABLE_NAME
        value: portfolio_symbols_dev
      - key: PORTFOLIO_RECORD_SORT_KEY
        value: "0"
      - key: CLERK_JWT_ISSUER
        value: https://social-earwig-19.clerk.accounts.dev
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
